<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <rect width="900" height="220" fill="#F5F2EA" />
  
  <!-- Subtle border hairline -->
  <rect x="1" y="1" width="898" height="218" fill="none" stroke="#D9D4C7" stroke-width="2" />
  
  <!-- Bauhaus decorative geometry: square blocks & rules -->
  <rect x="40" y="40" width="14" height="14" fill="#FF4F00" />
  <rect x="58" y="40" width="14" height="14" fill="#111111" />
  <rect x="76" y="40" width="14" height="14" fill="#111111" />
  <rect x="40" y="58" width="14" height="14" fill="#111111" />
  <rect x="58" y="58" width="14" height="14" fill="#F5F2EA" stroke="#111111" stroke-width="2" />
  <rect x="76" y="58" width="14" height="14" fill="#111111" />
  
  <!-- Wordmark -->
  <text x="115" y="66" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#111111" letter-spacing="-1">WatchItLearn</text>
  
  <!-- Divider -->
  <line x1="40" y1="105" x2="860" y2="105" stroke="#111111" stroke-width="2" />
  
  <!-- Tagline & Specs -->
  <text x="40" y="148" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#111111">
